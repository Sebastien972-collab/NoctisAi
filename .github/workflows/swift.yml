# Created by Sébastien DAGUIN
name: Swift Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate dependency downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com
      - name: Check toolchain and prepare Metal
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
